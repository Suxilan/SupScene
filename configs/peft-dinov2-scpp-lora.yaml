data:
  batch_size: 1
  diag_weight: 0.1
  image_size: 322
  iou_thresh: 0.2
  load_images: true
  n_sub: 80
  num_workers: 8
  pin_memory: true
  root_dir: data
  sampler_mode: anchor_expand
  samples_per_scene: null
  scenes_per_epoch: null
  shuffle: true
  split_file: data/GL3D/train
  teacher_name: null
  topk_per_hop: 32
  min_images_per_scene: 0
  val_split_file: data/GL3D/test
head:
  contrast_head:
    params:
      hidden_dim: 2048
      last_bn: false
      nlayers: 2
      out_dim: 256
      style: moco
    type: ContrastiveHead
log:
  eval_interval: 1
  eval_on_start: true
  eval_per_epochs: 1
  log_interval: 10
  log_with: wandb
  monitor_metric: metric/map@25
  monitor_mode: max
  output_dir: experiments/peft-dinov2-scpp-lora
  save_interval: 1
  wandb_config: {}
  wandb_name: peft-dinov2-scpp-lora
  wandb_project: SupScene
loss:
  contrast_loss:
    params:
      pos_th: 0.25
      exclude_self: true
      eps: 1.0e-8
      alpha: 2.0
      beta: 50.0
      base: 0.5
    type: MultiSimilarityLoss
  distill_loss:
    params:
      distill_type: relation
      tau: 4.0
    type: DistillLoss
metric:
  metric_ks:
  - 1
  - 25
  - 50
  - 100
  metric_pos_th: 0.25
model:
  aggregator:
    args: {}
    name: scpp
  backbone:
    args:
      model_name: dinov2_vitb14
      num_trainable_blocks: 12
      return_attn_maps: false
      return_cls_token: false
      lora_r: 16
      lora_alpha: 16
      lora_dropout: 0.1
      lora_bias: none
      lora_targets: [attn.qkv, attn.proj, mlp.fc1, mlp.fc2]
    name: dinov2
  deploy_head:
    args:
      use_projection: false
    name: deploy_head
  use_bn: true
  whitening: false
  whitening_dim: 1024
  final_norm: true
  ema_decay: 0.999
  ema_use_num_updates: true
  use_ema: false
  weights: null
optim:
  accumulate_grad_batches: 1
  epochs: 50
  eta_min: 1.0e-07
  grad_clip: 1.0
  lr: 0.0001
  optimizer: adamw
  scheduler: cosine
  use_conflictfree: false
  warmup_pct: 0.5
  warmup_start_factor: 0.01
  weight_decay: 0.01
system:
  deterministic: true
  device: cuda
  device_specific: false
  mixed_precision: bf16
  seed: 42
  use_accelerate: true
task:
  contrast_enabled: true
  contrast_weight: 1.0
  distill_enabled: false
  distill_weight: 5.0
  huber_enabled: false
  huber_weight: 0.5
  lowrank_enabled: false
  lowrank_weight: 0.2
